name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhoneSpecsGboard-AndroidProject.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o PhoneSpecsGboard-AndroidProject.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: project/PhoneSpecsGboard
        run: |
          # Create local.properties if needed
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          # Use Gradle wrapper if present, otherwise install Gradle
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            # Fallback: install Gradle 8.2
            wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
            unzip -q gradle-8.2-bin.zip -d $HOME/gradle
            $HOME/gradle/gradle-8.2/bin/gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpecsGboard-APK
          path: project/PhoneSpecsGboard/app/build/outputs/apk/debug/app-debug.apk
