name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhoneSpecsGboard-AndroidProject.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP exists
        run: |
          if [ ! -f "PhoneSpecsGboard-AndroidProject.zip" ]; then
            echo "ERROR: PhoneSpecsGboard-AndroidProject.zip not found in repository root!"
            echo "Please upload the ZIP file to the root of the repo."
            ls -la
            exit 1
          fi
          echo "ZIP found:"
          ls -lh PhoneSpecsGboard-AndroidProject.zip

      - name: Extract Android project
        run: |
          unzip -o PhoneSpecsGboard-AndroidProject.zip -d project
          echo "Extracted structure:"
          find project -maxdepth 3 -type d

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: project/PhoneSpecsGboard
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
            unzip -q gradle-8.2-bin.zip -d $HOME/gradle
            $HOME/gradle/gradle-8.2/bin/gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpecsGboard-APK
          path: project/PhoneSpecsGboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
